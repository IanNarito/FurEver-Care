<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Verification | FurEver Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        :root {
            --main-color: #3ba99c; /* Your primary green color */
            --light-bg: #f8f9fa; /* Light grey background */
            --brand-color: #e55331; /* Shopee's orange, kept for contrast elements like the "Pay" button */
        }

        body {
            background-color: var(--light-bg);
            font-family: Arial, sans-serif;
        }

        /* Top Bar - Mimicking a simple, distinct header */
        .top-bar {
            background-color: var(--main-color);
            height: 4px; /* A thin line to match the Shopee look */
        }

        .container-content {
            background-color: #ffffff;
            max-width: 650px; /* Constrain width like the screenshot */
            margin: 40px auto 0;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        /* Header for "Email Verification" */
        .verification-header {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .verification-header h4 {
            font-weight: 500;
            color: #555;
        }

        /* Detail Rows */
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .detail-label {
            color: #777;
        }
        .detail-value {
            font-weight: 500;
        }

        .total-payment-value {
            color: var(--brand-color); /* Use a high-contrast color for the price */
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Email Form */
        .email-form-group {
            max-width: 350px;
            margin: 20px 0;
        }
        .form-control {
            border-radius: 4px;
            border-color: #ccc;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(59, 169, 156, 0.25); /* Your green focus color */
            border-color: var(--main-color);
        }

        /* Pay Button */
        .btn-pay {
            background-color: var(--main-color); /* Using the main color for "Pay" */
            color: white;
            padding: 0.75rem 3rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .btn-pay:hover {
            background-color: #cf4b2d;
            color: white;
        }
        .pay-button-container {
            text-align: center;
            padding-top: 25px;
        }
    </style>
</head>
<body>
    
    <div class="top-bar"></div>

    <div class="container-content">
        <div class="verification-header">
            <h4 class="mb-0"><i class="fas fa-arrow-left me-2"></i>Email Verification</h4>
        </div>

        <div class="p-4">
            
            <div class="detail-row">
                <span class="detail-label">Total Payment</span>
                <span class="total-payment-value">₱999.00</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Payment Method</span>
                <span class="detail-value">Payment Center / e-Wallet - GCash</span>
            </div>

            <hr class="my-4">

            <form>
                <div class="detail-row mb-2">
                    <label for="emailInput" class="detail-label">Email</label>
                    <div class="email-form-group">
                        <input type="email" class="form-control" id="emailInput" 
                               value="juan.dela.cruz@example.com" 
                               placeholder="Enter your email address" required>
                    </div>
                </div>
                
                <p class="text-muted small text-center text-lg-start mt-3">
                    Please fill in and confirm your email address. A confirmation email will be sent when your payment is confirmed.
                </p>

                <div class="pay-button-container">
                    <button type="submit" class="btn btn-pay">Pay</button>
                </div>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
