<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart | FurEver Care</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --main-color: #3ba99c;
    }

    body {
      background-color: #f8f9fa;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--main-color);
      padding: 1rem 2rem;
    }

    .nav-links a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .logo img {
      height: 80px;
    }

    /* Table Styling */
    .cart-table {
      width: 100%;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .cart-table thead {
      background-color: var(--main-color);
      color: white;
    }

    .cart-table th, .cart-table td {
      padding: 1rem;
      vertical-align: middle;
      text-align: center;
    }

    .cart-table img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    .quantity-btn {
      border: none;
      background-color: var(--main-color);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      margin: 0 5px;
    }

    .btn-danger, .btn-warning {
      margin: 0 5px;
    }

    /* Footer */
    footer.site-footer {
      background-color: var(--main-color);
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 4rem;
    }

    .footer-nav a {
      color: #e1e1e1;
      margin: 0 10px;
      text-decoration: none;
    }

    .footer-nav a:hover {
      color: white;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="home.html" class="logo">
      <img src="assets/img/MAINLOGO.jpg" alt="FurEver Care Logo" />
    </a>
    <nav class="nav-links">
      <a href="home.html">Home</a>
      <a href="#services">Services Offered</a>
      <a href="appointment.html">Book an Appointment</a>
      <a href="adopt.html">Adopt a Pet</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <!-- Cart Table -->
  <div class="container my-5">
    <h2 class="text-center fw-bold mb-4">Your Shopping Cart</h2>

    <div class="table-responsive">
      <table class="table cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Total Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Item 1 -->
          <tr>
            <td>
              <img src="assets/img/Brit Care Adult Lamb Dog Treat.png" alt="Brit Care Adult Lamb Dog Treat" />
              <div>Brit Care Adult Lamb Dog Treat</div>
            </td>
            <td class="unit-price">699</td>
            <td>
              <button class="quantity-btn decrease-btn">-</button>
              <span class="quantity">1</span>
              <button class="quantity-btn increase-btn">+</button>
            </td>
            <td class="total-price">₱150</td>
            <td>
              <button class="btn btn-danger btn-sm delete-btn">Delete</button>
              <a href="checkout.html" class="btn btn-warning btn-sm">Checkout</a>
            </td>
          </tr>

          <!-- Item 2 -->
          <tr>
            <td>
              <img src="assets/img/squeaky toy ball.png" alt="Squeaky Ball" />
              <div>Squeaky Ball</div>
            </td>
            <td class="unit-price">250</td>
            <td>
              <button class="quantity-btn decrease-btn">-</button>
              <span class="quantity">1</span>
              <button class="quantity-btn increase-btn">+</button>
            </td>
            <td class="total-price">₱250</td>
            <td>
              <button class="btn btn-danger btn-sm delete-btn">Delete</button>
              <a href="checkout.html" class="btn btn-warning btn-sm">Checkout</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 FurEver Care. All Rights Reserved.</p>
      <nav class="footer-nav">
        <a href="#services">Services</a>
        <a href="#why">Why Choose Us</a>
        <a href="#adoption">Adopt</a>
        <a href="#comments">Comments</a>
      </nav>
    </div>
  </footer>

  <!-- Cart Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Quantity Logic
      document.querySelectorAll("tbody tr").forEach(row => {
        const increaseBtn = row.querySelector(".increase-btn");
        const decreaseBtn = row.querySelector(".decrease-btn");
        const quantitySpan = row.querySelector(".quantity");
        const unitPriceElem = row.querySelector(".unit-price");
        const totalPriceElem = row.querySelector(".total-price");

        let quantity = parseInt(quantitySpan.textContent);
        const unitPrice = parseInt(unitPriceElem.textContent);

        function updateTotal() {
          quantitySpan.textContent = quantity;
          const total = quantity * unitPrice;
          totalPriceElem.textContent = "₱" + total.toLocaleString();
        }

        increaseBtn.addEventListener("click", () => {
          quantity++;
          updateTotal();
        });

        decreaseBtn.addEventListener("click", () => {
          if (quantity > 1) {
            quantity--;
            updateTotal();
          }
        });

        updateTotal(); // initialize
      });

      // Remove from cart with confirmation
      document.querySelectorAll('.delete-btn').forEach(button => {
        button.addEventListener('click', function () {
          const row = this.closest('tr');
          const confirmDelete = confirm("Are you sure you want to remove this item from your cart?");
          if (confirmDelete) {
            row.remove();
            alert('Item removed from cart.');
          }
        });
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
